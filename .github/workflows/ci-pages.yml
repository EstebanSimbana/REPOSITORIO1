name: CI/CD Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  test:
    name: Validar HTML, accesibilidad, responsive y seguridad
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Preparar Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador de pruebas
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas de calidad
        run: npm test

  deploy:
    name: Publicar en GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Preparar sitio estatico
        run: |
          mkdir public
          cp index.html styles.css script.js public/
          touch public/.nojekyll

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: public

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
